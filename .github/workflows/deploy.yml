name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions: read-all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # -------------------------------------------------------------
  # Job 1: Build & Test (Elixir / Phoenix)
  # -------------------------------------------------------------
  test:
    name: 🧪 Build & Test (Phoenix)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: absolute_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      DATABASE_URL: ecto://postgres:postgres@localhost:5432/absolute_test
      SECRET_KEY_BASE: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup BEAM (Elixir / OTP)
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.17'
          otp-version: '27'

      - name: Restore dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Check code formatting
        run: mix format --check-formatted

      - name: Compile with warnings-as-errors
        run: mix compile --warnings-as-errors

      - name: Run Credo (Linting)
        run: mix credo --strict

      - name: Run Dialyzer (Type Checking)
        run: mix dialyzer

      - name: Run Excellent Migrations (Database Safety)
        run: mix excellent_migrations.check_safety

      - name: Run Sobelow (Security Scan)
        run: mix sobelow

      - name: Run ExUnit test suite with Coverage
        run: mix coveralls

  # -------------------------------------------------------------
  # Job 2: Validate Production Docker Container
  # -------------------------------------------------------------
  docker:
    name: 🐳 Validate Dockerfile Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3 # v3.10.0
      - name: Build Docker image
        uses: docker/build-push-action@v7 # v5.4.0
        with:
          context: .
          push: false
          load: true
          tags: absolute:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.28.0
        with:
          image-ref: 'absolute:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # -------------------------------------------------------------
  # Job 3: Validate Terraform Infrastructure Code
  # -------------------------------------------------------------
  terraform:
    name: 🏗️ Validate Infrastructure Code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@v4 # v3.2.0
        with:
          terraform_version: 1.9.8
      - name: Check Terraform formatting
        run: terraform fmt -check infra/
      - name: Configure AWS Credentials via OIDC Keyless Auth
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/absolute-github-actions-production
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Initialize Terraform
        run: |
          terraform -chdir=infra init \
            -backend-config="bucket=absolute-tfstate-production" \
            -backend-config="key=state/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Validate Terraform configuration
        run: terraform -chdir=infra validate

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3 # v1.0.3
        with:
          working_directory: infra/

      - name: Terraform Plan
        id: plan
        if: github.event_name == 'pull_request'
        run: |
          terraform -chdir=infra plan \
            -no-color \
            -out=tfplan

      - name: Save Terraform Plan as readable text
        if: github.event_name == 'pull_request'
        run: terraform -chdir=infra show -no-color tfplan > infra/tfplan.txt

      - name: Comment PR with Terraform Plan
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v2.9.2
        with:
          header: terraform-plan
          path: infra/tfplan.txt

  # -------------------------------------------------------------
  # Job 4: Load Testing (k6)
  # -------------------------------------------------------------
  performance_test:
    name: 🚀 Load Testing (k6)
    runs-on: ubuntu-latest
    needs: [docker]
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: absolute_prod
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3 # v3.10.0

      - name: Load Cached Docker Image
        uses: docker/build-push-action@v7 # v5.4.0
        with:
          context: .
          push: false
          load: true
          tags: absolute:latest
          cache-from: type=gha

      - name: Run Database Migrations
        run: |
          docker run --rm --net host \
            -e DATABASE_URL="ecto://postgres:postgres@localhost:5432/absolute_prod" \
            -e SECRET_KEY_BASE="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" \
            absolute:latest /app/bin/migrate

      - name: Start Application Container
        run: |
          docker run -d --name absolute_app --net host \
            -e PORT=4000 \
            -e PHX_HOST="localhost" \
            -e DATABASE_URL="ecto://postgres:postgres@localhost:5432/absolute_prod" \
            -e SECRET_KEY_BASE="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" \
            -e PHX_SERVER="true" \
            absolute:latest
          sleep 5

      - name: Run k6 Load Test
        uses: grafana/k6-action@v0.3.1 # v0.3.1
        with:
          filename: k6/load_test.js

  # -------------------------------------------------------------
  # Job 5: Deploy to AWS via Keyless OIDC (Only on main branch)
  # -------------------------------------------------------------
  deploy:
    name: 🚀 Deploy to AWS Cluster (OIDC Keyless)
    needs: [test, docker, terraform, performance_test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
      attestations: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS Credentials via OIDC Keyless Auth
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/absolute-github-actions-production
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4 # v3.2.0
        with:
          terraform_version: 1.9.8

      - name: Initialize Terraform
        run: |
          terraform -chdir=infra init \
            -backend-config="bucket=absolute-tfstate-production" \
            -backend-config="key=state/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Ensure ECR Repository Exists
        run: terraform -chdir=infra apply -target=aws_ecr_repository.absolute_repo -auto-approve

      - name: Get ECR Repository URL
        id: ecr-url
        run: echo "url=$(terraform -chdir=infra output -raw ecr_repository_url)" >> $GITHUB_OUTPUT

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3 # v3.10.0

      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v7 # v5.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr-url.outputs.url }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v2.2.0
        with:
          subject-name: ${{ steps.ecr-url.outputs.url }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v3.5.0

      - name: Sign the published Docker image
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: echo "${{ steps.ecr-url.outputs.url }}:${{ github.sha }}" | xargs -I {} cosign sign --yes {}

      - name: Capture Previous Deployment State
        run: |
          PREVIOUS_TAG=$(terraform -chdir=infra output -raw current_image_tag || echo "latest")
          echo "PREVIOUS_TAG=$PREVIOUS_TAG" >> $GITHUB_ENV

      - name: Apply Infrastructure (ALB, ASG, RDS)
        run: |
          terraform -chdir=infra apply \
            -var="image_tag=${{ github.sha }}" \
            -auto-approve

      - name: Verify Deployed Cluster Health
        run: |
          echo "🔍 Querying ALB DNS name..."
          ALB_DNS=$(terraform -chdir=infra output -raw alb_dns_name || true)
          if [ -n "$ALB_DNS" ]; then
            echo "📡 Waiting for ASG instances to boot and become healthy..."
            for i in {1..12}; do
              if curl -f -s --connect-timeout 5 "http://$ALB_DNS/api/health"; then
                echo -e "\n✅ Health check passed!"
                exit 0
              fi
              echo -n "."
              sleep 10
            done
            echo -e "\n❌ Health check failed after 2 minutes."
            exit 1
          fi

      - name: Rollback Infrastructure (On Failure)
        if: failure()
        run: |
          echo "🚨 Deployment failed! Rolling back to image tag: $PREVIOUS_TAG"
          terraform -chdir=infra apply \
            -var="image_tag=$PREVIOUS_TAG" \
            -auto-approve

      - name: Deployment Completed
        run: echo "🎉 Successfully deployed Absolute BEAM Cluster via Keyless OIDC Authentication!"
