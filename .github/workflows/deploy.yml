name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions: read-all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # -------------------------------------------------------------
  # Job 1: Build & Test (Elixir / Phoenix)
  # -------------------------------------------------------------
  test:
    name: 🧪 Build & Test (Phoenix)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: absolute_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      DATABASE_URL: ecto://postgres:postgres@localhost:5432/absolute_test
      SECRET_KEY_BASE: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup BEAM (Elixir / OTP)
        uses: erlef/setup-beam@5304e04ea2b355f03681464e683d92e3b2f18451 # v1.18.2
        with:
          elixir-version: '1.17'
          otp-version: '27'

      - name: Restore dependency cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Check code formatting
        run: mix format --check-formatted

      - name: Compile with warnings-as-errors
        run: mix compile --warnings-as-errors

      - name: Run Credo (Linting)
        run: mix credo --strict

      - name: Run Dialyzer (Type Checking)
        run: mix dialyzer

      - name: Run Excellent Migrations (Database Safety)
        run: mix excellent_migrations.check_safety

      - name: Run Sobelow (Security Scan)
        run: mix sobelow

      - name: Run ExUnit test suite with Coverage
        run: mix coveralls

  # -------------------------------------------------------------
  # Job 2: Validate Production Docker Container
  # -------------------------------------------------------------
  docker:
    name: 🐳 Validate Dockerfile Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3 # v3.10.0
      - name: Build Docker image
        uses: docker/build-push-action@v5 # v5.4.0
        with:
          context: .
          push: false
          load: true
          tags: absolute:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.28.0
        with:
          image-ref: 'absolute:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # -------------------------------------------------------------
  # Job 3: Validate Terraform Infrastructure Code
  # -------------------------------------------------------------
  terraform:
    name: 🏗️ Validate Infrastructure Code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@v3 # v3.2.0
        with:
          terraform_version: 1.9.8
      - name: Check Terraform formatting
        run: terraform fmt -check infra/
      - name: Configure AWS Credentials via OIDC Keyless Auth
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/absolute-github-actions-production
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Initialize Terraform
        run: |
          terraform -chdir=infra init \
            -backend-config="bucket=absolute-tfstate-production" \
            -backend-config="key=state/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Validate Terraform configuration
        run: terraform -chdir=infra validate

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3 # v1.0.3
        with:
          working_directory: infra/

      - name: Terraform Plan
        id: plan
        if: github.event_name == 'pull_request'
        run: |
          terraform -chdir=infra plan \
            -no-color \
            -out=tfplan

      - name: Save Terraform Plan as readable text
        if: github.event_name == 'pull_request'
        run: terraform -chdir=infra show -no-color tfplan > infra/tfplan.txt

      - name: Comment PR with Terraform Plan
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@331f8f5b4215f0445d3c07b4967662a32a2d3e31 # v2.9.2
        with:
          header: terraform-plan
          path: infra/tfplan.txt

  # -------------------------------------------------------------
  # Job 4: Load Testing (k6)
  # -------------------------------------------------------------
  performance_test:
    name: 🚀 Load Testing (k6)
    runs-on: ubuntu-latest
    needs: [docker]
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: absolute_prod
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3 # v3.10.0

      - name: Load Cached Docker Image
        uses: docker/build-push-action@v5 # v5.4.0
        with:
          context: .
          push: false
          load: true
          tags: absolute:latest
          cache-from: type=gha

      - name: Run Database Migrations
        run: |
          docker run --rm --net host \
            -e DATABASE_URL="ecto://postgres:postgres@localhost:5432/absolute_prod" \
            -e SECRET_KEY_BASE="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" \
            absolute:latest /app/bin/migrate

      - name: Start Application Container
        run: |
          docker run -d --name absolute_app --net host \
            -e PORT=4000 \
            -e PHX_HOST="localhost" \
            -e DATABASE_URL="ecto://postgres:postgres@localhost:5432/absolute_prod" \
            -e SECRET_KEY_BASE="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" \
            -e PHX_SERVER="true" \
            absolute:latest
          sleep 5

      - name: Run k6 Load Test
        uses: grafana/k6-action@v0.3.1 # v0.3.1
        with:
          filename: k6/load_test.js

  # -------------------------------------------------------------
  # Job 5: Deploy to AWS via Keyless OIDC (Only on main branch)
  # -------------------------------------------------------------
  deploy:
    name: 🚀 Deploy to AWS Cluster (OIDC Keyless)
    needs: [test, docker, terraform, performance_test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
      attestations: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS Credentials via OIDC Keyless Auth
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/absolute-github-actions-production
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3 # v3.2.0
        with:
          terraform_version: 1.9.8

      - name: Initialize Terraform
        run: |
          terraform -chdir=infra init \
            -backend-config="bucket=absolute-tfstate-production" \
            -backend-config="key=state/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Ensure ECR Repository Exists
        run: terraform -chdir=infra apply -target=aws_ecr_repository.absolute_repo -auto-approve

      - name: Get ECR Repository URL
        id: ecr-url
        run: echo "url=$(terraform -chdir=infra output -raw ecr_repository_url)" >> $GITHUB_OUTPUT

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3 # v3.10.0

      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v5 # v5.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr-url.outputs.url }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.0
        with:
          subject-name: ${{ steps.ecr-url.outputs.url }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.5.0

      - name: Sign the published Docker image
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: echo "${{ steps.ecr-url.outputs.url }}:${{ github.sha }}" | xargs -I {} cosign sign --yes {}

      - name: Capture Previous Deployment State
        run: |
          PREVIOUS_TAG=$(terraform -chdir=infra output -raw current_image_tag || echo "latest")
          echo "PREVIOUS_TAG=$PREVIOUS_TAG" >> $GITHUB_ENV

      - name: Apply Infrastructure (ALB, ASG, RDS)
        run: |
          terraform -chdir=infra apply \
            -var="image_tag=${{ github.sha }}" \
            -auto-approve

      - name: Verify Deployed Cluster Health
        run: |
          echo "🔍 Querying ALB DNS name..."
          ALB_DNS=$(terraform -chdir=infra output -raw alb_dns_name || true)
          if [ -n "$ALB_DNS" ]; then
            echo "📡 Waiting for ASG instances to boot and become healthy..."
            for i in {1..12}; do
              if curl -f -s --connect-timeout 5 "http://$ALB_DNS/api/health"; then
                echo -e "\n✅ Health check passed!"
                exit 0
              fi
              echo -n "."
              sleep 10
            done
            echo -e "\n❌ Health check failed after 2 minutes."
            exit 1
          fi

      - name: Rollback Infrastructure (On Failure)
        if: failure()
        run: |
          echo "🚨 Deployment failed! Rolling back to image tag: $PREVIOUS_TAG"
          terraform -chdir=infra apply \
            -var="image_tag=$PREVIOUS_TAG" \
            -auto-approve

      - name: Deployment Completed
        run: echo "🎉 Successfully deployed Absolute BEAM Cluster via Keyless OIDC Authentication!"
