services:
  postgres:
    # FIX: postgres:18 does not exist on Docker Hub. Using postgres:17 (latest stable).
    image: postgres:17
    container_name: absolute-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: absolute_dev

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d absolute_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
